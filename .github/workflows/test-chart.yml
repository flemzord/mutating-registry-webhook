name: Test Chart

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-chart:
    name: Helm Chart Install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Env
        uses: ./.github/actions/default

      - name: Generate and validate chart
        run: nix develop --command make validate-manifests

      - name: Create Kind cluster
        run: nix develop --command kind create cluster

      - name: Build and load controller image
        run: |
          nix develop --command make docker-build IMG=controller:latest
          nix develop --command kind load docker-image controller:latest

      - name: Install cert-manager
        run: |
          nix develop --command helm repo add jetstack https://charts.jetstack.io
          nix develop --command helm repo update
          nix develop --command helm install cert-manager jetstack/cert-manager \
            --version v1.21.2 \
            --namespace cert-manager \
            --create-namespace \
            --set crds.enabled=true \
            --wait \
            --timeout 5m

      - name: Deploy manager via Helm
        run: nix develop --command make helm-deploy IMG=controller:latest

      - name: Verify manager rollout
        run: >
          nix develop --command kubectl rollout status
          deployment/mutating-registry-webhook-controller-manager
          --namespace mutating-registry-webhook-system
          --timeout 2m
